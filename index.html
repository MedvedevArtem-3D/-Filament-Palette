<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Палитра материалов | Medvedev Artem</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background: #111111; 
      color: #e0e0e0; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .content-wrapper { padding: 30px 40px 40px; flex-grow: 1; width: 100%; }
    .top-bar { display: flex; flex-direction: row; align-items: center; margin-bottom: 40px; width: 100%; }
    .logo { width: 90px; height: 90px; object-fit: contain; margin-right: 40px; }

    /* Увеличенные фильтры */
    .filters { display: flex; gap: 14px; flex-wrap: wrap; }
    .filter-btn {
      display: inline-flex; align-items: center; background: transparent;
      color: #ccc; border: 1px solid #444; padding: 8px 18px 8px 22px;
      border-radius: 24px; cursor: pointer; font-size: 15px; transition: all 0.2s;
    }
    .filter-btn:hover { border-color: #888; color: #fff; }
    .filter-btn.active { background: #555; color: #fff; border-color: #555; }
    
    .count { font-size: 12px; background: rgba(255, 255, 255, 0.15); padding: 3px 8px; border-radius: 12px; margin-left: 10px; }
    .filter-btn.active .count { background: rgba(255, 255, 255, 0.3); }

    /* Сетка карточек стала крупнее */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }

    .card { background: #1a1a1a; border-radius: 14px; overflow: hidden; border: 1px solid #333; display: flex; flex-direction: column; }
    
    /* Стили для карусели и цветовой плашки (увеличена высота) */
    .color-swatch, .carousel { height: 240px; width: 100%; position: relative; background: #222; }
    .carousel { overflow: hidden; }
    .carousel-img { 
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
      object-fit: cover; opacity: 0; transition: opacity 0.3s ease; 
    }
    .carousel-img.active { opacity: 1; z-index: 1; }
    
    /* Плашка с названием материала в углу */
    .type-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(20, 20, 20, 0.85);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 600;
      z-index: 3; /* Чтобы плашка была поверх картинок */
      letter-spacing: 0.5px;
    }
    
    /* Навигация карусели (стрелки и точки) */
    .nav-btn {
      position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
      background: rgba(0, 0, 0, 0.6); color: white; border: none;
      width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.2s; font-size: 16px;
    }
    .carousel:hover .nav-btn { opacity: 1; }
    .nav-btn.left { left: 12px; }
    .nav-btn.right { right: 12px; }
    
    .dots {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      z-index: 2; display: flex; gap: 8px;
    }
    .dot { width: 8px; height: 8px; background: rgba(255,255,255,0.4); border-radius: 50%; }
    .dot.active { background: #fff; }

    /* Увеличенный текст в нижнем блоке */
    .info { padding: 20px; }
    .color-name { color: #ffffff; font-size: 18px; font-weight: 500; margin: 0; }

    footer { text-align: center; padding: 24px; font-size: 13px; color: #666; border-top: 1px solid #333; margin-top: auto; }

    /* Адаптация под телефоны */
    @media (max-width: 600px) {
      .content-wrapper { padding: 16px; }
      .top-bar { flex-direction: column; align-items: flex-start; margin-bottom: 24px; }
      .logo { margin-bottom: 20px; margin-right: 0; width: 70px; height: 70px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
      .color-swatch, .carousel { height: 160px; }
      .nav-btn { opacity: 1; background: rgba(0, 0, 0, 0.4); }
      .color-name { font-size: 16px; }
    }
  </style>
</head>
<body>

  <div class="content-wrapper">
    <header class="top-bar">
      <img src="logo.png" alt="Medvedev Artem 3D Studio" class="logo" onerror="this.style.display='none'">
      
      <div class="filters" id="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="PLA">PLA</button>
        <button class="filter-btn" data-filter="PETG">PETG</button>
        <button class="filter-btn" data-filter="TPU">TPU</button>
        <button class="filter-btn" data-filter="ABS">ABS</button>
        <button class="filter-btn" data-filter="PETG-CF">PETG-CF</button>
      </div>
    </header>

    <div class="grid" id="catalog"></div>
  </div>

  <footer>
    © 2026 Medvedev Artem 3D Studio
  </footer>

  <script>
    // Массив материалов остался полностью вашим без изменений
    const filaments = [
      { type: "PLA", name: "Синий темный", hex: "#061D62" },  
      { type: "PETG", name: "Оранжевый", images: ["orange_1.jpg", "orange_2.jpg"], hex: "#ff6600" },
      { type: "PETG", name: "Красный темный", hex: "#A70707" },
      { type: "PETG", name: "Розовый", hex: "#F3C1BB" },
      { type: "PETG", name: "Бежевый", hex: "#E4C48A" },
      { type: "PETG", name: "Серо-Бежевый", hex: "#BFAA92" },
      { type: "PETG", name: "Желтый", hex: "#F3CE2A" },
      { type: "PETG-CF", name: "Черный(карбон)", hex: "#272626" },
      { type: "TPU", name: "Черный", hex: "#000000" },
      { type: "PETG", name: "Белый", hex: "#ffffff" },
      { type: "PLA", name: "Слоновая кость", hex: "#EBE7DB" },
    ];

    const container = document.getElementById('catalog');
    const filterBtns = document.querySelectorAll('.filter-btn');

    window.switchSlide = function(event, direction, btn) {
      event.stopPropagation();
      const carousel = btn.closest('.carousel');
      const slides = carousel.querySelectorAll('.carousel-img');
      const dots = carousel.querySelectorAll('.dot');
      
      let activeIndex = Array.from(slides).findIndex(slide => slide.classList.contains('active'));
      
      slides[activeIndex].classList.remove('active');
      dots[activeIndex].classList.remove('active');
      
      if (direction === 'next') {
        activeIndex = (activeIndex + 1) % slides.length;
      } else {
        activeIndex = (activeIndex - 1 + slides.length) % slides.length;
      }
      
      slides[activeIndex].classList.add('active');
      dots[activeIndex].classList.add('active');
    };

    function renderCards(filterType) {
      container.innerHTML = ''; 
      
      const filtered = filterType === 'all' 
        ? filaments 
        : filaments.filter(f => f.type === filterType);

      filtered.forEach(f => {
        let visualHTML = '';
        // Генерируем плашку типа материала
        const badgeHTML = `<div class="type-badge">${f.type}</div>`;

        if (f.images && f.images.length > 0) {
          const imgsHTML = f.images.map((img, i) => `<img src="${img}" class="carousel-img ${i === 0 ? 'active' : ''}" loading="lazy">`).join('');
          
          let navHTML = '';
          if (f.images.length > 1) {
            navHTML = `
              <button class="nav-btn left" onclick="switchSlide(event, 'prev', this)">&#10094;</button>
              <button class="nav-btn right" onclick="switchSlide(event, 'next', this)">&#10095;</button>
              <div class="dots">
                ${f.images.map((_, i) => `<div class="dot ${i === 0 ? 'active' : ''}"></div>`).join('')}
              </div>
            `;
          }
          // Вставляем плашку внутрь карусели
          visualHTML = `<div class="carousel">${badgeHTML}${imgsHTML}${navHTML}</div>`;
        } else {
          // Вставляем плашку поверх заливки цветом
          visualHTML = `<div class="color-swatch" style="background-color: ${f.hex}">${badgeHTML}</div>`;
        }
        
        container.innerHTML += `
          <div class="card">
            ${visualHTML}
            <div class="info">
              <div class="color-name">${f.name}</div>
            </div>
          </div>`;
      });
    }

    function updateCounts() {
      filterBtns.forEach(btn => {
        const filter = btn.getAttribute('data-filter');
        const count = filter === 'all' ? filaments.length : filaments.filter(f => f.type === filter).length;
        const cleanText = btn.innerHTML.split('<span')[0].trim();
        btn.innerHTML = `${cleanText} <span class="count">${count}</span>`;
      });
    }

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderCards(btn.getAttribute('data-filter'));
      });
    });

    updateCounts();
    renderCards('all');
  </script>
</body>
</html>
