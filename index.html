<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Палитра материалов | Medvedev Artem</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background: #111111; 
      color: #e0e0e0; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* Шапка с единым изображением */
    header { 
      text-align: center; 
      padding: 24px 16px; 
    }
    .logo {
      width: 1000px;
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* Фильтры и счетчики */
    .filters {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 30px;
      padding: 0 16px;
    }
    .filter-btn {
      display: inline-flex;
      align-items: center;
      background: transparent;
      color: #ccc;
      border: 1px solid #444;
      padding: 6px 14px 6px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    .filter-btn:hover { border-color: #888; color: #fff; }
    .filter-btn.active { background: #555; color: #fff; border-color: #555; }
    
    /* Стили для цифры-счетчика */
    .count {
      font-size: 11px;
      background: rgba(255, 255, 255, 0.15);
      padding: 2px 6px;
      border-radius: 10px;
      margin-left: 8px;
    }
    .filter-btn.active .count {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Сетка карточек */
    .grid-container {
      flex-grow: 1;
      padding: 0 40px 40px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
      gap: 20px; 
    }

    /* Внешний вид карточки */
    .card { 
      background: #181818; 
      border-radius: 12px; 
      overflow: hidden; 
      border: 1px solid #333;
      display: flex;
      flex-direction: column;
    }
    .color-swatch { height: 140px; width: 100%; }
    .info { padding: 15px; font-size: 14px; }
    .type { font-weight: 700; color: #ffffff; font-size: 12px; margin-bottom: 4px; }
    .color-name { color: #ffffff; font-size: 16px; margin-bottom: 2px; }
    .brand { color: #888888; font-size: 12px; min-height: 14px; }

    /* Подвал */
    footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: #666;
      border-top: 1px solid #333;
      margin-top: auto;
    }

    /* Адаптация под телефоны */
    @media (max-width: 600px) {
      .grid-container { padding: 0 16px 30px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
      .color-swatch { height: 100px; }
    }
  </style>
</head>
<body>

  <header>
    <img src="logo.png" alt="Medvedev Artem 3D Studio" class="logo" onerror="this.style.display='none'">
  </header>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="PLA">PLA</button>
    <button class="filter-btn" data-filter="PETG">PETG</button>
    <button class="filter-btn" data-filter="TPU">TPU</button>
    <button class="filter-btn" data-filter="ABS">ABS</button>
    <button class="filter-btn" data-filter="PETG-CF">PETG-CF</button>
  </div>

  <div class="grid-container">
    <div class="grid" id="catalog"></div>
  </div>

  <footer>
    © 2026 Medvedev Artem 3D Studio
  </footer>

  <script>
    const filaments = [
      { type: "PLA", name: "Синий темный", hex: "#061D62" },  
      { type: "PETG", name: "Красный темный", hex: "#A70707" },
      { type: "PETG", name: "Розовый", hex: "#F3C1BB" },
      { type: "PETG", name: "Бежевый", hex: "#E4C48A" },
      { type: "PETG", name: "Серо-Бежевый", hex: "#BFAA92" },
      { type: "PETG", name: "Оранжевый", hex: "#ff6600" },
      { type: "PETG", name: "Желтый", hex: "#F3CE2A" },
      { type: "PETG-CF", name: "Черный(карбон)", hex: "#272626" },
      { type: "TPU", name: "Черный", hex: "#000000" },
      { type: "PETG", name: "Черный", hex: "#000000" },
      { type: "PETG", name: "Белый", hex: "#ffffff" },
      { type: "PETG", name: "Серый", hex: "#63676c" },
      { type: "PETG", name: "Синий", hex: "#1d387b" },
      { type: "PETG", name: "Зеленый темный", hex: "#274F11" },
      { type: "PETG", name: "Зеленый", hex: "#0ECE1E" },
      { type: "PLA", name: "Слоновая кость", hex: "#EBE7DB" },
    ];

    const container = document.getElementById('catalog');
    const filterBtns = document.querySelectorAll('.filter-btn');

    function renderCards(filterType) {
      container.innerHTML = ''; 
      
      const filtered = filterType === 'all' 
        ? filaments 
        : filaments.filter(f => f.type === filterType);

      filtered.forEach(f => {
        // Условие для скрытия undefined, если бренд не указан
        const brandText = f.brand ? f.brand : '';
        
        container.innerHTML += `
          <div class="card">
            <div class="color-swatch" style="background-color: ${f.hex}"></div>
            <div class="info">
              <div class="type">${f.type}</div>
              <div class="color-name">${f.name}</div>
              <div class="brand">${brandText}</div>
            </div>
          </div>`;
      });
    }

    function updateCounts() {
      filterBtns.forEach(btn => {
        const filter = btn.getAttribute('data-filter');
        const count = filter === 'all' 
          ? filaments.length 
          : filaments.filter(f => f.type === filter).length;
        
        const btnText = btn.textContent.trim();
        btn.innerHTML = `${btnText} <span class="count">${count}</span>`;
      });
    }

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderCards(btn.getAttribute('data-filter'));
      });
    });

    updateCounts();
    renderCards('all');
  </script>
</body>
</html>
