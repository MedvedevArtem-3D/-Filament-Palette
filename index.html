<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Палитра материалов | Medvedev Artem</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background: #111111; 
      color: #e0e0e0; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* Шапка с единым изображением */
    header { 
      text-align: center; 
      padding: 24px 16px; 
    }
    .logo {
      width: 1000px; /* Ограничитель ширины для больших мониторов */
      max-width: 100%; /* Защита от появления горизонтальной прокрутки на смартфонах */
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* Фильтры */
    .filters {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 30px;
      padding: 0 16px;
    }
    .filter-btn {
      background: transparent;
      color: #ccc;
      border: 1px solid #444;
      padding: 6px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    .filter-btn:hover { border-color: #888; color: #fff; }
    .filter-btn.active { background: #555; color: #fff; border-color: #555; }

    /* Сетка карточек */
    .grid-container {
      flex-grow: 1;
      padding: 0 40px 40px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
      gap: 20px; 
    }

    /* Внешний вид карточки */
    .card { 
      background: #181818; 
      border-radius: 12px; 
      overflow: hidden; 
      border: 1px solid #333;
      display: flex;
      flex-direction: column;
    }
    .color-swatch { height: 140px; width: 100%; }
    .info { padding: 15px; font-size: 14px; }
    .type { font-weight: 700; color: #ffffff; font-size: 12px; margin-bottom: 4px; }
    .color-name { color: #ffffff; font-size: 16px; margin-bottom: 2px; }
    .brand { color: #888888; font-size: 12px; }

    /* Подвал */
    footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: #666;
      border-top: 1px solid #333;
      margin-top: auto;
    }

    /* Адаптация под телефоны */
    @media (max-width: 600px) {
      .grid-container { padding: 0 16px 30px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
      .color-swatch { height: 100px; }
    }
  </style>
</head>
<body>

  <header>
    <!-- Изображение, включающее текст, логотип и линии -->
    <img src="logo.png" alt="Medvedev Artem 3D Studio" class="logo" onerror="this.style.display='none'">
  </header>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="PLA">PLA</button>
    <button class="filter-btn" data-filter="PETG">PETG</button>
    <button class="filter-btn" data-filter="TPU">TPU</button>
    <button class="filter-btn" data-filter="ABS">ABS</button>
  </div>

  <div class="grid-container">
    <div class="grid" id="catalog"></div>
  </div>

  <footer>
    © 2026 Medvedev Artem 3D Studio
  </footer>

  <script>
    const filaments = [
      { brand: "FDplast", type: "PLA", name: "Черный", hex: "#1a1a1a" },  
      { brand: "FDplast", type: "PETG", name: "Бордовый", hex: "#A70707" },
      { brand: "Bestfilament", type: "PETG", name: "Оранжевый", hex: "#ff6600" },
      { brand: "eSUN", type: "TPU", name: "Натуральный", hex: "#e8e4c9" },
      { brand: "FDplast", type: "PETG", name: "Белый", hex: "#ffffff" },
      { brand: "Rec", type: "ABS", name: "Графитовый", hex: "#63676c" },
      { brand: "Filamentum", type: "PETG", name: "Синий", hex: "#1d387b" },
      { brand: "Raise3D", type: "PLA", name: "Зеленый", hex: "#2b5c37" },
      { brand: "eSUN", type: "TPU", name: "Серый", hex: "#aaaaaa" }
    ];

    const container = document.getElementById('catalog');
    const filterBtns = document.querySelectorAll('.filter-btn');

    function renderCards(filterType) {
      container.innerHTML = ''; 
      
      const filtered = filterType === 'all' 
        ? filaments 
        : filaments.filter(f => f.type === filterType);

      filtered.forEach(f => {
        container.innerHTML += `
          <div class="card">
            <div class="color-swatch" style="background-color: ${f.hex}"></div>
            <div class="info">
              <div class="type">${f.type}</div>
              <div class="color-name">${f.name}</div>
              <div class="brand">${f.brand}</div>
            </div>
          </div>`;
      });
    }

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderCards(btn.getAttribute('data-filter'));
      });
    });

    renderCards('all');
  </script>
</body>
</html>
